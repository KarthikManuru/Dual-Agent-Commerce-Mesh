services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce_mesh_pg
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: meshdev
      POSTGRES_DB: commerce_mesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d commerce_mesh"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commerce_mesh_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
